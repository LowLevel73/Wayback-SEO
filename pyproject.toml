[project]
name = "wayback-seo"
version = "0.1.0"
description = "Spot when a website went down and came back, from Wayback Machine captures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Enrico Altavilla" }]
dependencies = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/LowLevel73/Wayback-SEO"

[project.scripts]
wayback-seo = "wayback_seo.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
