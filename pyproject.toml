[project]
name = "wayback-seo"
version = "0.1.0"
description = "Spot when a website went down and came back, from Wayback Machine captures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.scripts]
wayback-seo = "wayback_seo.core:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
