[project]
name = "wayback-seo"
version = "0.1.0"
description = "Wayback SEO uses the Wayback Machine to find outages, broken migrations and robots.txt changes in a website's past."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enrico Altavilla" }]
dependencies = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/LowLevel73/Wayback-SEO"

[project.scripts]
wayback-seo = "wayback_seo.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
